name: Native build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows/amd64
            artifact: windows-amd64
          - os: macos-latest
            target: darwin/arm64
            artifact: macos-arm64
          - os: macos-latest
            target: darwin/amd64
            artifact: macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/preview -out artifacts
      - run: python scripts/package.py --targets ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: RepoDock-${{ matrix.artifact }}
          path: |
            dist/RepoDock-*.zip
            dist/SHA256SUMS.txt
            artifacts/*.png
